name: Frontend E2E

on:
  pull_request:
  push:

jobs:
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCK_API: 'false'
      - name: Install Playwright browser
        working-directory: frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build Nginx frontend image
        working-directory: frontend
        run: docker build --tag url-shortener-frontend-e2e .
      - name: Build proxy test backend
        run: docker build --tag url-shortener-proxy-backend frontend/tests/proxy-backend
      - name: Create E2E network
        run: docker network create url-shortener-e2e
      - name: Start proxy test backend
        run: docker run --detach --rm --name backend --network url-shortener-e2e --network-alias backend url-shortener-proxy-backend
      - name: Start Nginx frontend
        run: docker run --detach --rm --name url-shortener-frontend-e2e --network url-shortener-e2e --publish 8080:8080 url-shortener-frontend-e2e
      - name: Wait for Nginx
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs url-shortener-frontend-e2e
          exit 1
      - name: Verify Nginx API and short-code proxying
        run: |
          for attempt in {1..30}; do
            if api_response=$(curl --fail --silent --max-time 2 http://127.0.0.1:8080/api/probe); then
              break
            fi
            sleep 1
          done
          if [ -z "${api_response:-}" ]; then
            docker logs backend
            docker logs url-shortener-frontend-e2e
            exit 1
          fi
          echo "$api_response" | grep -q '"path": "/api/probe"'
          status=$(curl --silent --max-time 5 --output /tmp/short-code-response.json --write-out '%{http_code}' http://127.0.0.1:8080/probe-code)
          test "$status" = "410"
          grep -q '"detail": "expired"' /tmp/short-code-response.json
      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Stop Nginx frontend
        if: always()
        run: |
          docker rm --force url-shortener-frontend-e2e backend
          docker network rm url-shortener-e2e
